<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookings | BusGo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17233c;font-family:Arial,sans-serif}header{background:#102746;color:white;padding:17px 5%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}header a{color:white;text-decoration:none;margin-left:18px}.brand{font-weight:bold;color:#65d7c2;font-size:23px}.banner{padding:30px 5%;color:white;background:linear-gradient(90deg,#102746f2,#10274655),url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1500&q=80') center/cover}.banner h1{margin:0 0 8px}.container{max-width:1200px;margin:25px auto;padding:0 18px;display:grid;grid-template-columns:340px 1fr;gap:20px}.panel{background:white;padding:22px;border-radius:15px;box-shadow:0 8px 25px #10274610}label{display:block;font-size:13px;font-weight:bold;margin:11px 0 5px}input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:white}button{border:0;border-radius:8px;padding:10px 13px;background:#16b89a;color:white;font-weight:bold;cursor:pointer;margin:5px 3px 0 0}.secondary{background:#52647a}.danger{background:#d94f5c}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e6ebf2;font-size:13px}th{background:#edf3f8}.message{margin:10px 0;font-size:14px;color:#087b66}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:850px){.container{grid-template-columns:1fr}}@media(max-width:450px){.row2{grid-template-columns:1fr}}
</style></head><body><header><div class="brand">🚌 BusGo</div><nav><a href="/">Home</a><a href="/buses.html">Buses</a><a href="/bookings.html">Bookings</a></nav></header>
<section class="banner"><h1>Passenger Reservations</h1><p>Create and manage bookings with bus and passenger dropdowns.</p></section>
<main class="container"><section class="panel"><h2 id="formTitle">Create booking</h2><form id="bookingForm"><input type="hidden" id="booking_id">
<label>Passenger name</label><input id="passenger_name" required placeholder="Enter passenger name">
<label>Phone number</label><input id="phone" required inputmode="tel" pattern="[0-9+ -]{7,20}" placeholder="Enter contact number">
<label>Select bus / route</label><select id="bus_id" required><option value="">Loading buses…</option></select>
<div class="row2"><div><label>Seats</label><input id="seats" type="number" min="1" max="6" value="1" required></div><div><label>Status</label><select id="status"><option>Confirmed</option><option>Cancelled</option></select></div></div>
<button type="submit">Save Booking</button><button type="button" class="secondary" onclick="resetForm()">Clear</button><div class="message" id="msg"></div></form></section>
<section class="panel"><h2>Booking list</h2><label>Filter bookings</label><select id="statusFilter" onchange="renderBookings()"><option value="">All statuses</option><option>Confirmed</option><option>Cancelled</option></select><div class="table-wrap"><table><thead><tr><th>ID</th><th>Passenger</th><th>Phone</th><th>Bus / Route</th><th>Seats</th><th>Booked on</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
let bookings=[],buses=[];const $=id=>document.getElementById(id);
async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadBuses(){try{buses=await api('/api/buses');$('bus_id').innerHTML='<option value="">Choose bus route</option>'+buses.map(b=>`<option value="${b.bus_id}">${esc(b.bus_name)} · ${esc(b.source)} → ${esc(b.destination)} · ${String(b.travel_date).slice(0,10)} · ₹${Number(b.fare).toFixed(2)} (${b.available_seats} seats left)</option>`).join('')}catch(e){$('msg').textContent='Cannot load buses: '+e.message}}
async function loadBookings(){try{bookings=await api('/api/bookings');renderBookings()}catch(e){$('msg').textContent='Backend error: '+e.message}}
function renderBookings(){const f=$('statusFilter').value;const list=bookings.filter(b=>!f||b.status===f);$('rows').innerHTML=list.map(b=>`<tr><td>${b.booking_id}</td><td>${esc(b.passenger_name)}</td><td>${esc(b.phone)}</td><td>${esc(b.bus_name)}<br>${esc(b.source)} → ${esc(b.destination)}</td><td>${b.seats}</td><td>${String(b.booking_date).slice(0,19).replace('T',' ')}</td><td>${esc(b.status)}</td><td><button class="secondary" onclick="editBooking(${b.booking_id})">Edit</button><button class="danger" onclick="deleteBooking(${b.booking_id})">Delete</button></td></tr>`).join('')||'<tr><td colspan="8">No bookings found.</td></tr>'}
function resetForm(){$('bookingForm').reset();$('booking_id').value='';$('seats').value=1;$('formTitle').textContent='Create booking'}
function editBooking(id){const b=bookings.find(x=>x.booking_id===id);if(!b)return;['booking_id','passenger_name','phone','bus_id','seats','status'].forEach(k=>$(k).value=b[k]??'');$('formTitle').textContent='Edit booking #'+id;window.scrollTo({top:0,behavior:'smooth'})}
$('bookingForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('booking_id').value;const b={passenger_name:$('passenger_name').value,phone:$('phone').value,bus_id:Number($('bus_id').value),seats:Number($('seats').value),status:$('status').value};try{await api(id?'/api/bookings/'+id:'/api/bookings',{method:id?'PUT':'POST',body:JSON.stringify(b)});$('msg').textContent=id?'Booking updated':'Booking created';resetForm();await Promise.all([loadBookings(),loadBuses()])}catch(e){$('msg').textContent=e.message}});
async function deleteBooking(id){if(!confirm('Delete booking #'+id+'?'))return;try{await api('/api/bookings/'+id,{method:'DELETE'});await Promise.all([loadBookings(),loadBuses()])}catch(e){alert(e.message)}}
Promise.all([loadBuses(),loadBookings()]);
</script></body></html>
