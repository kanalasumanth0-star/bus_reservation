<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bus Management | BusGo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17233c;font-family:Arial,sans-serif}header{background:#102746;color:white;padding:17px 5%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}header a{color:white;text-decoration:none;margin-left:18px}.brand{font-weight:bold;color:#65d7c2;font-size:23px}.banner{padding:30px 5%;color:white;background:linear-gradient(90deg,#102746eF,#10274666),url('https://images.unsplash.com/photo-1570125909232-eb263c188f7e?auto=format&fit=crop&w=1500&q=80') center/cover}.banner h1{margin:0 0 8px}.container{max-width:1200px;margin:25px auto;padding:0 18px;display:grid;grid-template-columns:340px 1fr;gap:20px}.panel{background:white;padding:22px;border-radius:15px;box-shadow:0 8px 25px #10274610}label{display:block;font-size:13px;font-weight:bold;margin:11px 0 5px}input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:white}button,.btn{border:0;border-radius:8px;padding:10px 13px;background:#16b89a;color:white;font-weight:bold;cursor:pointer;margin:5px 3px 0 0}.secondary{background:#52647a}.danger{background:#d94f5c}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e6ebf2;font-size:13px}th{background:#edf3f8}.message{margin:10px 0;font-size:14px;color:#087b66}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:850px){.container{grid-template-columns:1fr}}@media(max-width:450px){.row2{grid-template-columns:1fr}}
</style></head><body><header><div class="brand">🚌 BusGo</div><nav><a href="/">Home</a><a href="/buses.html">Buses</a><a href="/bookings.html">Bookings</a></nav></header>
<section class="banner"><h1>Bus Fleet Management</h1><p>Add new routes, edit bus details, and keep seat availability up to date.</p></section>
<main class="container"><section class="panel"><h2 id="formTitle">Add a bus</h2><form id="busForm">
<input type="hidden" id="bus_id"><label>Bus name</label><input id="bus_name" required placeholder="e.g. Orange Travels">
<div class="row2"><div><label>Source</label><select id="source" required><option value="">Choose source</option><option>Hyderabad</option><option>Bangalore</option><option>Chennai</option><option>Vijayawada</option><option>Kurnool</option><option>Visakhapatnam</option></select></div><div><label>Destination</label><select id="destination" required><option value="">Choose destination</option><option>Hyderabad</option><option>Bangalore</option><option>Chennai</option><option>Vijayawada</option><option>Kurnool</option><option>Visakhapatnam</option></select></div></div>
<div class="row2"><div><label>Departure</label><input id="departure_time" type="time" required></div><div><label>Arrival</label><input id="arrival_time" type="time" required></div></div>
<label>Travel date</label><input id="travel_date" type="date" required>
<div class="row2"><div><label>Total seats</label><input id="total_seats" type="number" min="1" value="40" required></div><div><label>Available seats</label><input id="available_seats" type="number" min="0" value="40" required></div></div>
<label>Bus type</label><select id="bus_type"><option>AC Sleeper</option><option>AC Seater</option><option>Non-AC Seater</option><option>Non-AC Sleeper</option><option>Volvo Multi-Axle</option></select>
<label>Fare (₹)</label><input id="fare" type="number" min="0" step="0.01" value="500" required>
<button type="submit">Save Bus</button><button type="button" class="secondary" onclick="resetForm()">Clear</button><div class="message" id="msg"></div></form></section>
<section class="panel"><h2>Bus list</h2><label>Filter by route</label><select id="routeFilter" onchange="renderBuses()"><option value="">All routes</option><option>Hyderabad</option><option>Bangalore</option><option>Chennai</option><option>Vijayawada</option><option>Kurnool</option><option>Visakhapatnam</option></select><div class="table-wrap"><table><thead><tr><th>ID</th><th>Bus</th><th>Route</th><th>Date</th><th>Time</th><th>Seats</th><th>Type</th><th>Fare</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
let buses=[];
const $=id=>document.getElementById(id);
async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function loadBuses(){try{buses=await api('/api/buses');renderBuses()}catch(e){$('msg').textContent='Backend error: '+e.message+' (check MySQL connection)'}}
function renderBuses(){const f=$('routeFilter').value;const list=buses.filter(b=>!f||b.source===f||b.destination===f);$('rows').innerHTML=list.map(b=>`<tr><td>${b.bus_id}</td><td>${esc(b.bus_name)}</td><td>${esc(b.source)} → ${esc(b.destination)}</td><td>${String(b.travel_date).slice(0,10)}</td><td>${String(b.departure_time).slice(0,5)} – ${String(b.arrival_time).slice(0,5)}</td><td>${b.available_seats}/${b.total_seats}</td><td>${esc(b.bus_type)}</td><td>₹${Number(b.fare).toFixed(2)}</td><td><button class="secondary" onclick="editBus(${b.bus_id})">Edit</button><button class="danger" onclick="deleteBus(${b.bus_id})">Delete</button></td></tr>`).join('')||'<tr><td colspan="9">No buses found.</td></tr>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function resetForm(){$('busForm').reset();$('bus_id').value='';$('total_seats').value=40;$('available_seats').value=40;$('fare').value=500;$('formTitle').textContent='Add a bus'}
async function editBus(id){const b=buses.find(x=>x.bus_id===id);if(!b)return;['bus_id','bus_name','source','destination','departure_time','arrival_time','travel_date','total_seats','available_seats','bus_type','fare'].forEach(k=>$(k).value=b[k]??'');$('formTitle').textContent='Edit bus #'+id;window.scrollTo({top:0,behavior:'smooth'})}
$('busForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('bus_id').value;const b={};['bus_name','source','destination','departure_time','arrival_time','travel_date','total_seats','available_seats','bus_type','fare'].forEach(k=>b[k]=$(k).value);['total_seats','available_seats','fare'].forEach(k=>b[k]=Number(b[k]));try{await api(id?'/api/buses/'+id:'/api/buses',{method:id?'PUT':'POST',body:JSON.stringify(b)});$('msg').textContent=id?'Bus updated successfully':'Bus added successfully';resetForm();await loadBuses()}catch(e){$('msg').textContent=e.message}});
async function deleteBus(id){if(!confirm('Delete bus #'+id+'?'))return;try{await api('/api/buses/'+id,{method:'DELETE'});await loadBuses()}catch(e){alert(e.message)}}
loadBuses();
</script></body></html>
